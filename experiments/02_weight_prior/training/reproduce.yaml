model: mlx-community/Qwen3-8B-4bit
train: true
fine_tune_type: lora
data: experiments/02_weight_prior/training/data
seed: 271828

# Prompt tokens are excluded from the supervised loss. Only assistant completions train.
mask_prompt: true
num_layers: 16
batch_size: 1
grad_accumulation_steps: 4
iters: 80
max_seq_length: 2048
grad_checkpoint: true
clear_cache_threshold: 0

optimizer: adam
learning_rate: 0.00002
steps_per_report: 5
steps_per_eval: 20
val_batches: -1
save_every: 20
adapter_path: outputs/law-a-qwen3-8b-diverse-v2-reproduction
test: true
test_batches: -1

lora_parameters:
  rank: 8
  dropout: 0.05
  scale: 16.0
